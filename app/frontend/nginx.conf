server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Adı hash'li dosyalar değişmez, uzun süre cache'lenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API adresi değiştiğinde tarayıcı eski config.js'i kullanmasın
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
